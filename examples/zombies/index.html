<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zombie Chase - libavoid-rust Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
      color: #e94560;
    }

    .instructions {
      margin-bottom: 15px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
    }

    .instructions kbd {
      background: #333;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: monospace;
      margin: 0 2px;
    }

    #game-container {
      position: relative;
      background: #16213e;
      border: 3px solid #e94560;
      border-radius: 8px;
    }

    #game-canvas {
      display: block;
    }

    #hud {
      display: flex;
      gap: 20px;
      margin-top: 15px;
      font-size: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #hud .stat {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #hud .label {
      color: #888;
    }

    #hud .value {
      font-weight: bold;
      font-size: 20px;
    }

    #timer .value {
      color: #4ecca3;
    }

    #round .value {
      color: #ffd369;
    }

    #zombies .value {
      color: #e94560;
    }

    #distance .value {
      color: #74b9ff;
    }

    .health-stat {
      width: 100%;
      justify-content: center;
      margin-bottom: 5px;
    }

    .health-bar {
      font-size: 14px;
      letter-spacing: 1px;
    }

    .debug-controls {
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #888;
      font-size: 14px;
    }

    .debug-controls input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .debug-controls label {
      cursor: pointer;
    }

    #game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      padding: 40px 60px;
      border-radius: 12px;
      text-align: center;
      display: none;
    }

    #game-over h2 {
      font-size: 36px;
      margin-bottom: 15px;
    }

    #game-over.win h2 {
      color: #4ecca3;
    }

    #game-over.lose h2 {
      color: #e94560;
    }

    #game-over p {
      font-size: 16px;
      margin-bottom: 20px;
      color: #aaa;
    }

    .button-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      background: #e94560;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #ff6b6b;
    }

    button.secondary {
      background: #3d5a80;
    }

    button.secondary:hover {
      background: #4a6fa5;
    }

    #loading {
      font-size: 24px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>Zombie Chase</h1>
  <div class="instructions">
    Move with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or <kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> keys. Collect 🍎 for health. Survive each round!
  </div>

  <div id="loading">Loading WASM module...</div>

  <div id="game-container" style="display: none;">
    <svg id="game-canvas" width="800" height="600"></svg>
    <div id="game-over">
      <h2 id="result-text"></h2>
      <p id="result-message"></p>
      <div class="button-row">
        <button id="continue-btn" onclick="game.nextRound()">Next Round</button>
        <button id="restart-btn" class="secondary" onclick="game.restart()">Play Again</button>
      </div>
    </div>
  </div>

  <div id="hud" style="display: none;">
    <div class="stat health-stat">
      <span class="label">Health:</span>
      <span id="health-bar" class="health-bar"></span>
    </div>
    <div class="stat" id="round">
      <span class="label">Round:</span>
      <span class="value" id="round-value">1</span>
    </div>
    <div class="stat" id="timer">
      <span class="label">Time:</span>
      <span class="value" id="time-value">10.0</span>
    </div>
    <div class="stat" id="zombies">
      <span class="label">Zombies:</span>
      <span class="value" id="zombies-value">1</span>
    </div>
    <div class="stat" id="distance">
      <span class="label">Nearest:</span>
      <span class="value" id="distance-value">0</span>
    </div>
  </div>

  <div class="debug-controls">
    <input type="checkbox" id="show-paths" checked>
    <label for="show-paths">Debug: show connector paths</label>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
