[package]
name = "libavoid"
version = "0.1.0"
edition = "2021"
authors = ["Ported from C++ libavoid by Michael Wybrow"]
license = "LGPL-2.1"
description = "Fast, object-avoiding connector routing for interactive diagram editors"
repository = "https://github.com/mjwybrow/adaptagrams"
keywords = ["routing", "pathfinding", "diagrams", "connectors", "orthogonal"]
categories = ["algorithms", "graphics"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[dev-dependencies]

[features]
default = []
wasm = ["wasm-bindgen", "serde", "serde-wasm-bindgen"]

[lib]
name = "libavoid"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[example]]
name = "simple_routing"
path = "examples/simple_routing.rs"
